[project]
name = "mstodo-mcp"
version = "0.1.0"
description = "MCP server for reading and editing Microsoft To Do via Microsoft Graph"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "msal>=1.39.0",
    "requests>=2.34.2",
]

[project.scripts]
mstodo-mcp = "mstodo_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mstodo_mcp"]
